<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>求生日誌｜末日求生者</title>
<style>
:root{--bg:#0d0c0a;--bg2:#17150f;--bg3:#211d15;--line:#3a3222;--gold:#e0b65a;--gold2:#a8843c;--tx:#ddd6c8;--tx2:#9a9080;--red:#d8664f;--grn:#7fb069;--blu:#6fa8c8;--org:#e09a4a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
#app{max-width:860px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#141209,#0f0d09);border-bottom:1px solid var(--line);padding:6px 12px 0}
.top h1{margin:0;font-size:16px;color:var(--gold);letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.top h1 small{font-size:11px;color:var(--tx2);letter-spacing:0;font-weight:normal;margin-left:auto}
.strip{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--tx2);padding:4px 0}
.strip b{color:var(--tx);font-weight:normal}
.tabs{display:flex;overflow-x:auto;gap:2px;margin:0 -12px;padding:0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:8px 11px;color:var(--tx2);font-size:14px}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tab i{font-style:normal;background:var(--red);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;margin-left:3px}
main{flex:1;padding:12px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--gold);display:flex;align-items:center;gap:6px}
.card h3 span{margin-left:auto;font-size:12px;color:var(--tx2);font-weight:normal}
.muted{color:var(--tx2);font-size:12px}
.need{display:grid;grid-template-columns:44px 1fr 38px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bar{height:8px;background:#2a251b;border-radius:4px;overflow:hidden}
.bar>div{height:100%;border-radius:4px;background:var(--grn)}
.bar.mid>div{background:var(--org)}.bar.low>div{background:var(--red)}
.need .v{text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:12px}
.chip.bad{border-color:#6b2f24;color:#f0a090}.chip.good{border-color:#3d5a2e;color:#b8dca0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center;min-height:44px}
.btn:hover{border-color:var(--gold2)}
.btn.pri{background:#3a2e14;border-color:var(--gold2);color:var(--gold)}
.btn.warn{border-color:#6b2f24;color:#f0a090}
.btn small{display:block;font-size:11px;color:var(--tx2);margin-top:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #2a251b}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-size:14px}.row .ds{font-size:12px;color:var(--tx2)}
.mini{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px;white-space:nowrap}
.mini.on{border-color:var(--gold2);color:var(--gold)}
.sel{border-color:var(--gold)!important;background:#2b2412!important}
.lock{opacity:.45}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2b2412;border:1px solid var(--gold2);color:var(--gold);padding:9px 16px;border-radius:20px;z-index:50;max-width:90%;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:var(--bg2);border:1px solid var(--gold2);border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.modal h2{margin:0 0 10px;color:var(--gold);font-size:17px}
.modal p{margin:6px 0}
.vs{display:flex;align-items:center;justify-content:space-around;text-align:center;margin:10px 0;padding:10px;background:var(--bg);border-radius:8px}
.vs b{display:block;font-size:24px;color:var(--gold)}
.banner{background:#4a1f17;color:#ffd0c4;padding:8px 12px;font-size:13px;text-align:center}
.busy{background:#2b2412;color:var(--gold);padding:6px 12px;font-size:12px;text-align:center}
.map{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;touch-action:manipulation}
.wiz-step{font-size:12px;color:var(--tx2);margin-bottom:8px}
.bgcard{display:block;width:100%;text-align:left;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.bgcard b{color:var(--gold);font-size:15px}.bgcard div{font-size:12px;color:var(--tx2);margin-top:3px}
.pts{position:sticky;top:0;background:var(--bg2);padding:8px 0;z-index:2;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.pts b{font-size:22px;color:var(--gold)}.pts b.neg{color:var(--red)}
.trait{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #2a251b}
.trait .c{min-width:34px;text-align:center;font-size:12px;border-radius:5px;padding:2px 0}
.trait .c.pos{background:#3a2e14;color:var(--gold)}.trait .c.neg{background:#1f3324;color:#a8d898}
.log{font-size:12px;color:var(--tx2);max-height:320px;overflow:auto}
.log div{padding:3px 0;border-top:1px dashed #2a251b}
.grave{padding:8px 0;border-top:1px solid #2a251b}
.grave b{color:var(--tx)}
.foot{font-size:11px;color:#6b6252;text-align:center;padding:12px}
.ms{display:flex;gap:8px;padding:6px 0}
.ms .dot{width:22px;height:22px;border-radius:11px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 22px}
.ms.done .dot{background:#3d5a2e;border-color:#3d5a2e}.ms.cur .dot{border-color:var(--gold);color:var(--gold)}
textarea{min-height:60px;resize:vertical}
label.f{display:block;margin:8px 0 3px;font-size:12px;color:var(--tx2)}

.mini-needs{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0 6px}
.mn{position:relative;display:inline-flex;align-items:center;gap:3px;background:#211d15;border:1px solid var(--line);border-radius:6px;padding:1px 6px 1px 4px;font-size:11px;overflow:hidden;min-width:52px}
.mn i{position:absolute;left:0;bottom:0;height:2px;background:var(--grn)}.mn.mid i{background:var(--org)}.mn.low i{background:var(--red)}.mn.low{border-color:#6b2f24}
.mn b{color:var(--gold);font-weight:normal}.mn em{font-style:normal;margin-left:auto;font-variant-numeric:tabular-nums}
.story .slog{max-height:calc(100vh - 290px);min-height:240px;overflow-y:auto;padding-right:4px}
.story .ai{padding:6px 0 10px;border-bottom:1px dashed #2a251b;opacity:.6}.story .ai.cur{opacity:1}
.story .me{margin:8px 0 8px auto;max-width:85%;width:fit-content;background:#2b2412;border:1px solid var(--gold2);border-radius:10px 10px 2px 10px;padding:6px 10px;font-size:13px;white-space:pre-wrap}
.story .me.sys{background:#1d211a;border-color:#3d5a2e;color:#b8dca0;font-size:12px}
.s-st{font-size:12px;color:var(--tx2);margin:4px 0}
.s-p{margin:6px 0;line-height:1.75}
.s-d{margin:6px 0;line-height:1.75;color:#f0d999;padding-left:8px;border-left:2px solid var(--gold2)}
.s-col{font-size:12px;color:var(--tx2);margin-top:6px;background:var(--bg);border-radius:6px;padding:4px 8px}
.s-btns{display:grid;gap:6px;margin-top:10px}
.s-btns .btn{text-align:left;min-height:38px;padding:8px 10px}
.say{display:flex;gap:6px;margin-top:8px;align-items:stretch}
.say textarea{flex:1;min-height:44px;max-height:120px}
.say .btn{min-width:64px}
.wide{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:12px;align-items:start}
.wide .sl{position:sticky;top:96px}
.wide .story .slog{max-height:calc(100vh - 260px)}
.wide .grid3{grid-template-columns:repeat(3,1fr)}
@media (min-width:760px){#app{max-width:1200px}}
@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>
